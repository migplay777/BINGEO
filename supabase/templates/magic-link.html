<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#0d0f12;font-family:Arial,sans-serif;color:#f4f6f8;">
    <div style="max-width:520px;margin:0 auto;padding:40px 24px;">
      <h1 style="margin:0 0 12px;font-size:30px;">Bingeo<span style="color:#b04cff;">.</span></h1>
      <h2 style="margin:0 0 16px;font-size:22px;">Código de acesso</h2>
      <p style="line-height:1.6;color:#c7ccd3;">Digite este código no Bingeo para concluir seu acesso:</p>
      <div style="margin:28px 0;padding:20px;border-radius:14px;background:#171a20;text-align:center;font-size:34px;font-weight:700;letter-spacing:8px;">{{ .Token }}</div>
      <p style="line-height:1.6;color:#9ba3ad;font-size:14px;">O Bingeo nunca pede este código fora da tela oficial de autenticação.</p>
    </div>
  </body>
</html>
