<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingeo — sua estante de séries</title>
<link rel="icon" type="image/jpeg" href="/assets/bingeo-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121319;
    --panel:#1A1C25;
    --panel-2:#20222D;
    --line:#2C2E3C;
    --text:#ECEBF3;
    --text-muted:#9092A8;
    --text-dim:#5F6178;
    --violet:#8B5CF6;
    --violet-dim:#6D4FC2;
    --blue:#4C7CF0;
    --amber:#F0B63B;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.brand,.nav-link,.section-title,.field-label,.btn,.chip{
    font-family:'Space Grotesk',sans-serif;
  }
  button{font-family:inherit;}
  input,select,textarea{font-family:'Manrope',sans-serif;}
  ::selection{background:var(--violet);color:#fff;}

  /* ---- ticker ---- */
  .ticker-bar{
    background:linear-gradient(90deg, var(--violet-dim), var(--blue));
    color:#fff;
    overflow:hidden;
    white-space:nowrap;
    height:30px;
    display:flex;
    align-items:center;
    font-size:12.5px;
    letter-spacing:.02em;
  }
  .ticker-bar .no-live{padding-left:16px; font-weight:600;}
  .ticker-track{display:inline-flex; align-items:center; animation:ticker 22s linear infinite; padding-left:100%;}
  .ticker-track.slow{animation-duration:32s;}
  @keyframes ticker{0%{transform:translateX(0);}100%{transform:translateX(-100%);}}
  .ticker-item{padding:0 28px; font-weight:600; display:inline-flex; align-items:center; gap:8px;}
  .ticker-item .live-dot{width:6px;height:6px;border-radius:50%;background:#fff;display:inline-block;animation:pulse 1.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  /* ---- topbar ---- */
  .topbar{display:flex; align-items:center; gap:24px; padding:14px 28px; border-bottom:1px solid var(--line); background:var(--bg); flex-wrap:wrap;}
  .brand{font-size:22px; font-weight:700; letter-spacing:-.025em; color:var(--text); display:flex; align-items:baseline; gap:2px;}
  .brand .dot{background:linear-gradient(90deg,var(--violet),var(--blue)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .nav{display:flex; gap:4px; flex:1; flex-wrap:wrap;}
  .nav-link{background:transparent; border:none; color:var(--text-muted); font-size:15px; font-weight:600; padding:8px 14px; cursor:pointer; border-bottom:2px solid transparent; transition:color .15s ease, border-color .15s ease;}
  .nav-link:hover{color:var(--text);}
  .nav-link.active{color:var(--text); border-bottom-color:var(--violet);}
  .search-wrap{position:relative; min-width:220px;}
  .search-wrap input{width:100%; background:var(--panel); border:1px solid var(--line); color:var(--text); padding:9px 14px 9px 34px; border-radius:20px; font-size:13.5px; outline:none;}
  .search-wrap input:focus{border-color:var(--blue);}
  .search-wrap::before{content:""; position:absolute; left:13px; top:50%; transform:translateY(-50%); width:11px;height:11px;border:1.5px solid var(--text-muted);border-radius:50%;}
  .search-wrap::after{content:""; position:absolute; left:21px; top:63%; width:6px;height:1.5px;background:var(--text-muted); transform:rotate(45deg);}

  main{max-width:1180px; margin:0 auto; padding:28px 28px 80px;}

  /* ---- trending ---- */
  .trending{background:linear-gradient(160deg, rgba(139,92,246,.14), rgba(76,124,240,.06)); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; margin-bottom:32px;}
  .trending-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
  .trending-head h2{margin:0; font-size:19px; font-weight:600;}
  .trending-note{font-size:11.5px; color:var(--text-dim);}
  .trend-row{display:flex; gap:14px; overflow-x:auto; padding-bottom:4px;}
  .trend-card{flex:0 0 128px; cursor:pointer;}
  .trend-rank{position:absolute; top:6px; left:6px; background:rgba(0,0,0,.4); color:#fff; font-size:11px; font-weight:700; padding:2px 7px; border-radius:5px; font-family:'Space Grotesk',sans-serif;}
  .trend-title{font-size:12.5px; font-weight:600; margin-top:6px; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .trend-count{font-size:11px; color:var(--text-dim); margin-top:2px;}

  /* ---- filter chips ---- */
  .chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px;}
  .chip{background:var(--panel); border:1px solid var(--line); color:var(--text-muted); padding:7px 14px; border-radius:18px; font-size:13px; font-weight:600; cursor:pointer;}
  .chip:hover{color:var(--text);}
  .chip.active{background:var(--violet); border-color:var(--violet); color:#fff;}

  .btn{border:none; border-radius:7px; padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; transition:filter .15s ease, transform .1s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:linear-gradient(100deg,var(--violet),var(--blue)); color:#fff;}
  .btn-primary:hover{filter:brightness(1.1);}
  .btn-ghost{background:transparent; color:var(--text-muted); border:1px solid var(--line);}
  .btn-ghost:hover{color:var(--text); border-color:var(--text-muted);}
  .btn-danger{background:transparent; color:#F16565; border:1px solid rgba(241,101,101,.4);}
  .btn-danger:hover{background:rgba(241,101,101,.1);}
  .btn-sm{padding:6px 12px; font-size:12.5px;}

  .section{margin-bottom:30px; padding-bottom:26px; border-bottom:1px solid var(--line);}
  .section:last-child{border-bottom:none; padding-bottom:0; margin-bottom:0;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px;}
  .section-title{font-size:18px; font-weight:600; display:flex; align-items:center; gap:8px;}
  .section-count{color:var(--text-dim); font-size:13px; font-family:'Manrope',sans-serif;}
  .live-dot-sm{width:7px;height:7px;border-radius:50%;background:var(--violet); display:inline-block; animation:pulse 1.2s ease-in-out infinite;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:20px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; cursor:pointer; transition:border-color .15s ease, transform .15s ease; position:relative;}
  .card:hover{border-color:var(--text-dim); transform:translateY(-3px);}
  .grid .poster{height:auto;aspect-ratio:2/3;background-size:contain !important;background-repeat:no-repeat !important;background-position:center !important;}
  @media(max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid .poster{aspect-ratio:2/3}}
  .poster{height:150px; position:relative; display:flex; align-items:flex-end; padding:10px; overflow:hidden;background-color:#0d0f16;background-repeat:no-repeat;background-position:center;}
  .poster-icon{position:absolute; top:14px; right:10px; width:58px; height:58px; opacity:.9; transform:rotate(-6deg);}
  .monogram{position:absolute; bottom:10px; right:10px; width:26px; height:26px; border-radius:7px; background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.18); color:rgba(255,255,255,.85); font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center;}
  .poster .type-pill{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; background:rgba(0,0,0,.35); color:#fff; padding:3px 7px; border-radius:4px;}
  .poster.trend-poster{height:96px; border-radius:8px; padding:8px;}
  .poster.trend-poster .poster-icon{width:38px; height:38px; top:8px; right:6px;}
  .poster.trend-poster .monogram{width:19px; height:19px; font-size:10px; bottom:6px; right:6px; border-radius:5px;}
  .poster .fav-mark{position:absolute; top:8px; right:8px; color:var(--amber); font-size:14px;}
  .quick-add-btn{position:absolute; top:8px; right:8px; background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.3); color:#fff; width:24px;height:24px; border-radius:50%; font-size:14px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .quick-add-btn:hover{background:var(--violet); border-color:var(--violet);}
  .card-body{padding:10px 12px 12px;}
  .card-title{font-size:14.5px; font-weight:600; line-height:1.3; margin-bottom:5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .card-meta{display:flex; align-items:center; justify-content:space-between; font-size:11.5px; color:var(--text-muted);}
  .status-dot{width:6px;height:6px;border-radius:50%; display:inline-block; margin-right:5px;}
  .status-quero .status-dot{background:var(--text-dim);}
  .status-assistindo .status-dot{background:var(--violet); animation:pulse 1.2s ease-in-out infinite;}
  .status-completo .status-dot{background:var(--blue);}
  .status-pausado .status-dot{background:var(--amber);}
  .status-abandonado .status-dot{background:var(--text-dim);}
  .card-stars{font-size:11px; color:var(--amber);}
  .not-added-label{font-size:11px; color:var(--text-dim);}

  .empty{border:1px dashed var(--line); border-radius:var(--radius); padding:32px 20px; text-align:center; color:var(--text-muted); font-size:13.5px;}
  .empty strong{display:block; color:var(--text); font-size:15px; margin-bottom:5px; font-weight:600;}

  /* ---- stars widget ---- */
  .stars{position:relative; display:inline-block; font-size:19px; line-height:1; letter-spacing:2px; user-select:none;}
  .stars-bg,.stars-fg{white-space:nowrap;}
  .stars-bg{color:var(--line);}
  .stars-fg{position:absolute; top:0; left:0; overflow:hidden; color:var(--amber); pointer-events:none;}
  .stars-hit{position:absolute; top:0; left:0; width:100%; height:100%; display:flex;}
  .stars-hit .hit{flex:1 1 0; background:transparent; border:0; cursor:pointer; padding:0;}
  .stars.lg{font-size:26px;}
  .stars.sm{font-size:14px; letter-spacing:1px;}

  /* ---- diary ---- */
  .diary-day{margin-bottom:22px;}
  .diary-date{font-size:12.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; font-weight:700; margin-bottom:8px; font-family:'Space Grotesk',sans-serif;}
  .diary-entry{display:flex; gap:12px; align-items:flex-start; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:8px;}
  .diary-dot{width:34px;height:34px;border-radius:6px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:700; color:rgba(255,255,255,.8); font-size:14px;}
  .diary-content{flex:1;}
  .diary-title-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .diary-title{font-weight:600; font-size:14px; cursor:pointer;}
  .diary-title:hover{color:var(--blue);}
  .diary-note{font-size:13px; color:var(--text-muted); margin-top:4px;}
  .diary-del{background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:12px;}
  .diary-del:hover{color:#F16565;}

  /* ---- lists (coleções visuais) ---- */
  .list-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; cursor:pointer; transition:border-color .15s ease, transform .15s ease;}
  .list-card:hover{border-color:var(--text-dim); transform:translateY(-2px);}
  .list-card-body{padding:13px 15px 15px;}
  .list-card-body h3{margin:0 0 4px; font-size:16px; font-weight:600;}
  .list-card-body p{margin:0 0 8px; font-size:12.5px; color:var(--text-muted); min-height:16px;}
  .list-card-body .count{font-size:11.5px; color:var(--text-dim);}
  .lists-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; margin-bottom:26px;}
  .list-cover{height:140px; background:var(--panel-2);}
  .list-cover-empty{display:flex; align-items:center; justify-content:center; color:var(--text-dim); font-size:12px; border-bottom:1px dashed var(--line);}
  .list-cover-1 .list-cover-tile{width:100%; height:100%;}
  .list-cover-2{display:grid; grid-template-columns:1fr 1fr; gap:2px; height:100%;}
  .list-cover-4{display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:2px; height:100%;}
  .list-cover-2 .list-cover-tile,.list-cover-4 .list-cover-tile{width:100%; height:100%;}
  .list-visibility{font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; font-weight:700;}
  .new-list-form{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:24px;}
  .new-list-form input{flex:1; min-width:160px;}
  .qa-input{background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:10px 12px; border-radius:7px; font-size:14px; outline:none;}
  .qa-input:focus{border-color:var(--violet);}
  .list-detail-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:12px; flex-wrap:wrap;}
  .pick-row{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:7px; cursor:pointer; border:1px solid transparent;}
  .pick-row:hover{background:var(--panel-2);}
  .pick-row.in-list{border-color:var(--blue);}
  .pick-swatch{width:26px;height:26px;border-radius:5px; flex-shrink:0;}
  .pick-check{margin-left:auto; width:16px;height:16px;border-radius:4px;border:1.5px solid var(--text-dim); display:flex; align-items:center; justify-content:center; font-size:11px;}
  .pick-row.in-list .pick-check{background:var(--blue); border-color:var(--blue); color:#0b0d0f;}

  /* ---- profile ---- */
  .profile-head{display:flex; align-items:center; gap:18px; margin-bottom:30px; flex-wrap:wrap;position:relative;z-index:2;}
  .profile-head.with-banner{margin-top:-72px;padding:0 4px 8px;}
  .avatar-wrap{position:relative; width:84px; height:84px; flex-shrink:0;}
  .avatar{width:84px; height:84px; border-radius:50%; background-size:cover; background-position:center; background-color:var(--panel-2); border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:700; color:var(--text-muted); cursor:pointer; overflow:hidden;box-shadow:0 12px 28px rgba(0,0,0,.24);}
  .avatar-edit{position:absolute; bottom:-2px; right:-2px; background:var(--violet); border:2px solid var(--bg); color:#fff; width:26px;height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; cursor:pointer;}
  .profile-name{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;letter-spacing:-.02em;}
  .profile-sub{font-size:12.5px; color:var(--text-muted); margin-top:2px;}
  .profile-actions{display:flex; gap:8px; margin-top:8px;}
  .profile-banner{width:100vw;height:50vh;min-height:320px;max-height:720px;margin-left:calc((100% - 100vw)/2);margin-right:calc((100% - 100vw)/2);margin-bottom:0;border:0;border-radius:0;background-color:var(--panel-2);background-position:center center;background-size:cover;background-repeat:no-repeat;position:relative;overflow:hidden;image-rendering:auto;}
  .profile-banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,19,25,.02) 0%,rgba(18,19,25,.08) 40%,rgba(18,19,25,.38) 68%,rgba(18,19,25,.82) 86%,var(--bg) 100%);pointer-events:none;}
  /* Em telas grandes, compacte a área de informações abaixo do banner para manter a proporção visual da versão minimizada. */
  @media (min-width: 900px) and (min-height: 700px){
    /* Compacta somente o conteúdo abaixo do banner em telas grandes,
       preservando o comportamento mais espaçado em telas menores. */
    .profile-banner{margin-bottom:0;}
    .profile-head{gap:12px;margin-bottom:8px;}
    .profile-head.with-banner{margin-top:-64px;}
    .profile-head .avatar-wrap{transform:scale(.88);transform-origin:left center;margin-right:-10px;}
    .profile-name{font-size:18px;}
    .profile-sub{margin-top:1px;}
    .profile-actions{margin-top:5px;gap:5px;}
    .top5-section{margin-bottom:14px;}
    .top5-section .section-head{margin-bottom:8px;}
    .stat-grid{margin-bottom:14px;gap:8px;}
    .section{margin-bottom:18px;padding-bottom:14px;}
  }
  .profile-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .profile-edit-section{margin-bottom:20px;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);}
  .profile-edit-section h3{margin:0 0 12px;font-size:15px;}
  .color-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .color-input{width:46px;height:34px;padding:2px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer;}
  .social-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .social-link{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--text);text-decoration:none;font-size:12px;}
  .social-link:hover{border-color:var(--text-muted);}
  .social-list-row{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);}
  .social-list-row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pro-locked-action{opacity:.65;}
  @keyframes berryNameFlow{
    0%{background-position:0% 50%;filter:drop-shadow(0 0 4px rgba(77,124,63,.30));}
    20%{filter:drop-shadow(0 0 7px rgba(139,195,74,.38));}
    40%{filter:drop-shadow(0 0 9px rgba(201,183,59,.38));}
    65%{filter:drop-shadow(0 0 11px rgba(194,71,139,.46));}
    85%{filter:drop-shadow(0 0 12px rgba(139,92,246,.55));}
    100%{background-position:200% 50%;filter:drop-shadow(0 0 5px rgba(77,124,63,.30));}
  }
  .profile-name.name-glow{text-shadow:0 0 6px currentColor,0 0 14px currentColor,0 0 26px color-mix(in srgb,currentColor 45%,transparent);}
  .profile-name.name-animated{
    background-image:linear-gradient(90deg,#4d7c3f 0%,#8bc34a 20%,#c9b73b 40%,#c2478b 65%,#8B5CF6 82%,#4C7CF0 100%);
    background-size:200% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent !important;
    animation:berryNameFlow 3.2s cubic-bezier(.45,0,.55,1) infinite;
  }

  .top5-section{margin-bottom:34px;}
  .top5-row{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:16px;}
  @media(max-width:700px){.top5-row{grid-template-columns:repeat(2,minmax(0,1fr));}}
  .top5-slot{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; position:relative;}
  .top5-slot.empty-slot{display:flex; align-items:center; justify-content:center; color:var(--text-dim); font-size:12px; border-style:dashed; text-align:center; padding:10px; aspect-ratio:2/3; min-height:0;}
  .top5-rank{position:absolute; top:8px; left:8px; background:rgba(0,0,0,.5); color:#fff; font-size:12px; font-weight:700; padding:3px 8px; border-radius:6px; font-family:'Space Grotesk',sans-serif; z-index:2;backdrop-filter:blur(6px);}
  .top5-slot .poster{height:auto;min-height:0;aspect-ratio:2/3;background-size:contain !important;background-repeat:no-repeat !important;background-position:center !important;background-color:#0d0f16;}
  .top5-controls{position:absolute; bottom:8px; right:8px; display:flex; gap:4px; z-index:2;}
  .top5-mini-btn{background:rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.25); color:#fff; width:22px;height:22px; border-radius:5px; font-size:11px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .top5-mini-btn:hover{background:var(--violet);}
  .top5-picker{margin-top:16px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px;}
  .top5-picker-row{display:flex; align-items:center; gap:10px; padding:7px 6px; border-radius:6px;}
  .top5-picker-row:hover{background:var(--panel-2);}
  .top5-picker-row .pick-swatch{width:24px;height:24px;border-radius:5px;}
  .top5-picker-row span{flex:1; font-size:13.5px;}

  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; margin-bottom:30px;}
  .stat-box{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px;}
  .stat-num{font-size:28px; font-weight:700; font-family:'Space Grotesk',sans-serif; color:var(--text);}
  .stat-label{font-size:12px; color:var(--text-muted); margin-top:2px;}
  .bars{display:flex; flex-direction:column; gap:7px;}
  .bar-row{display:flex; align-items:center; gap:10px; font-size:12px; color:var(--text-muted);}
  .bar-row .bar-label{width:34px; text-align:right; flex-shrink:0;}
  .bar-track{flex:1; height:8px; background:var(--panel-2); border-radius:4px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--amber); border-radius:4px;}
  .bar-row .bar-count{width:22px; color:var(--text-dim);}

  /* ---- modal ---- */
  .modal-overlay{position:fixed; inset:0; background:rgba(8,9,13,.78); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; z-index:50;scroll-behavior:auto;}

  .series-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,28,37,0) 38%,rgba(26,28,37,.25) 62%,rgba(26,28,37,.88) 84%,var(--panel) 100%);pointer-events:none;}
  .modal-close{position:absolute; top:14px; right:14px; background:rgba(7,8,12,.58); border:1px solid rgba(255,255,255,.16); color:#fff; width:32px;height:32px;border-radius:50%; cursor:pointer; font-size:15px; line-height:1;z-index:3;backdrop-filter:blur(8px);}
  .modal-body{padding:0 24px 24px;position:relative;z-index:2;margin-top:-38px;}
  .modal-title{font-size:19px; font-weight:600; margin:0 0 4px;}
  .modal-sub{font-size:12.5px; color:var(--text-muted); margin-bottom:16px;}
  .field-label{font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-dim); font-weight:700; margin-bottom:5px; display:block;}
  .field-group{margin-bottom:16px;}
  .modal select,.modal textarea{width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:9px 11px; border-radius:7px; font-size:14px; outline:none;}
  .modal select:focus,.modal textarea:focus{border-color:var(--violet);}
  .modal textarea{resize:vertical; min-height:70px; line-height:1.4;}
  .modal-section{border-top:1px solid var(--line); padding-top:16px; margin-top:16px;}
  .inline-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .fav-toggle{background:none; border:1px solid var(--line); color:var(--text-muted); border-radius:7px; padding:8px 12px; cursor:pointer; font-size:13px;}
  .fav-toggle.active{border-color:var(--amber); color:var(--amber);}
  .modal-footer{display:flex; justify-content:space-between; margin-top:20px; padding-top:16px; border-top:1px solid var(--line); flex-wrap:wrap; gap:10px;}

  .season-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0;}
  .season-toggle{background:none; border:none; color:var(--text); font-size:14px; font-weight:600; cursor:pointer; padding:0; display:flex; align-items:center; gap:6px; font-family:'Manrope',sans-serif;}
  .season-toggle .arrow{display:inline-block; transition:transform .15s ease; color:var(--text-dim); font-size:11px;}
  .season-toggle.open .arrow{transform:rotate(90deg);}
  .episodes-wrap{padding:2px 0 8px 18px; border-left:2px solid var(--line); margin-left:4px;}
  .ep-row{display:flex; align-items:center; justify-content:space-between; padding:5px 0; font-size:12.5px; color:var(--text-muted);}

  /* ---- episode card (título + sinopse + avaliação + diário) ---- */
  .ep-card{padding:12px 0; border-bottom:1px solid var(--line);}
  .ep-card:last-child{border-bottom:none;}
  .ep-card-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .ep-num{font-size:11px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; font-family:'Space Grotesk',sans-serif;}
  .ep-title{font-size:13.5px; font-weight:600; color:var(--text); margin-top:2px;}

  /* ---- Diário em calendário vertical ---- */
  .cal-month{margin-bottom:26px;}

  .cal-day-num{flex:0 0 46px; text-align:center;}

  .cal-day-num .wd{font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.03em; margin-top:2px;}

  .cal-entry{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:11px 13px; margin-bottom:8px; display:flex; gap:11px; align-items:flex-start;}
  .cal-entry:last-child{margin-bottom:0;}
  .cal-dot{width:32px;height:32px;border-radius:6px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:700; color:rgba(255,255,255,.85); font-size:13px;}

  .cal-entry-top{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;}

  .cal-kind-badge{font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:2px 6px; border-radius:4px; background:var(--panel-2); color:var(--text-dim); border:1px solid var(--line);}

  .cal-note{font-size:12.5px; color:var(--text-muted); margin-top:5px;}

  /* ---- amadurecimento da amora (avaliação Pro) ---- */
  .berry-lab{margin-top:12px;}
  .berry-vine{position:relative; height:6px; background:var(--line); border-radius:3px; margin:6px 4px 18px; overflow:hidden;}
  .berry-vine-fill{position:absolute; top:0; left:0; height:100%; border-radius:3px; background:linear-gradient(90deg,#4d7c3f,#8bc34a,#c9b73b,#c2478b,#8B5CF6); transition:width .45s cubic-bezier(.34,1.56,.64,1);}
  .berry-stage2{flex:1 1 84px; min-width:76px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 6px 9px; cursor:pointer; text-align:center; color:var(--text-muted); position:relative; transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease; overflow:visible;}
  .berry-stage2:hover{transform:translateY(-3px); border-color:var(--text-dim);}
  .berry-stage2 .berry-emoji2{display:block; font-size:26px; line-height:1; margin-bottom:6px; transition:transform .35s cubic-bezier(.34,1.56,.64,1), filter .35s ease; filter:grayscale(.55) brightness(.85);}
  .berry-stage2 .berry-name2{font-size:11px; font-weight:700; display:block; color:var(--text-muted);}
  .berry-stage2 .berry-desc2{font-size:9.5px; color:var(--text-dim); display:block; margin-top:2px; line-height:1.3;}
  .berry-stage2.active{border-color:var(--violet); background:linear-gradient(160deg,rgba(139,92,246,.16),rgba(76,124,240,.06)); box-shadow:0 0 0 1px var(--violet) inset, 0 6px 18px rgba(139,92,246,.25);}
  .berry-stage2.active .berry-emoji2{transform:scale(1.28) rotate(-4deg); filter:grayscale(0) brightness(1) drop-shadow(0 0 6px rgba(139,92,246,.55)); animation:berryPop .45s cubic-bezier(.34,1.56,.64,1);}
  .berry-stage2.active .berry-name2{color:#fff;}
  .berry-stage2.active::after{content:"✓"; position:absolute; top:-7px; right:-7px; width:19px;height:19px; border-radius:50%; background:var(--violet); color:#fff; font-size:10.5px; font-weight:700; display:flex; align-items:center; justify-content:center; animation:berryBadge .35s ease;}
  @keyframes berryPop{0%{transform:scale(.7) rotate(0);}55%{transform:scale(1.4) rotate(-8deg);}100%{transform:scale(1.28) rotate(-4deg);}}
  @keyframes berryBadge{0%{transform:scale(0);opacity:0;}70%{transform:scale(1.2);opacity:1;}100%{transform:scale(1);opacity:1;}}
  .berry-current-label{font-size:12px; color:var(--text-muted); margin-top:12px; min-height:16px;}
  .berry-current-label strong{color:#c9b7ff;}

  .banner-note{background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:10px 14px; font-size:12.5px; color:var(--text-muted); margin-bottom:24px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}

  ::-webkit-scrollbar{width:9px; height:9px;}

  /* ---- TMDB integration ---- */
  .poster.tmdb-poster .poster-icon,.poster.tmdb-poster .monogram{display:none;}

  .tmdb-logo-badge{display:inline-flex;align-items:center;justify-content:center;padding:3px 7px;border-radius:4px;background:#01b4e4;color:#fff;font-weight:900;letter-spacing:.04em;font-size:10px;margin-right:7px;text-decoration:none}

  .tmdb-series-copy{min-width:0}
  .tmdb-search-card .poster{background-position:center;background-size:cover}
  @media(max-width:640px){.tmdb-series-header{grid-template-columns:110px minmax(0,1fr);gap:12px}.tmdb-series-poster{width:110px}}

  /* ---- premium evaluation formats (incremental) ---- */
  .premium-box{margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}

  .berry-emoji{font-size:20px;display:block;margin-bottom:4px}.berry-name{font-size:11px;font-weight:700;display:block}.berry-score{font-size:10px;color:var(--text-dim);display:block;margin-top:2px}
  .reaction-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.reaction-btn{width:42px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:19px;cursor:pointer}.reaction-btn.active{border-color:var(--violet);background:rgba(139,92,246,.16)}
  .premium-locked{margin-top:10px;color:var(--text-muted);font-size:12px;line-height:1.45}.plan-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--text-muted);font-size:11px;font-weight:700}.plan-pill.pro{border-color:rgba(139,92,246,.45);color:#c9b7ff;background:rgba(139,92,246,.10)}.profile-plan{margin-top:8px}

  .bingeo-logo-img{display:block;width:100%;height:100%;object-fit:cover}

  .auth-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;background:radial-gradient(circle at 20% 0%,rgba(139,92,246,.22),transparent 34%),radial-gradient(circle at 85% 100%,rgba(76,124,240,.14),transparent 32%),var(--bg)}

  .auth-logo{width:92px;height:92px;margin:0 auto 18px;border-radius:24px;overflow:hidden;box-shadow:0 14px 40px rgba(76,124,240,.16),0 0 30px rgba(139,92,246,.16)}
  .auth-title{text-align:center;font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;letter-spacing:.01em;margin:0 0 7px}

    var cat=getCatalog(entry.catalogId);
    var payload={
      user_id:currentUserId,
      catalog_id:entry.catalogId,
      tmdb_id:(cat&&cat.tmdbId)?Number(cat.tmdbId):null,
      title:(cat&&cat.title)||entry.catalogId,

      criteria_ratings:entry.criteriaRatings||{},

      var result=await supabaseClient.from('library_entries').upsert(payload,{onConflict:'user_id,catalog_id'});

        if(!cat&&row.tmdb_id){

  function chooseTmdbMatch(results,cat){
    if(!results||!results.length)return null;

    }
    if(exactTitle.length)return exactTitle.sort(function(a,b){return Number(b.vote_count||0)-Number(a.vote_count||0);})[0];

  function tmdbSeriesInfoHtml(cat){if(!tmdbConfigured())return '';if(!cat.tmdbLoaded){return '<div class="tmdb-loading">Carregando dados oficiais da TMDB…</div>';}var d=cat.tmdbData||{},credits=d.aggregate_credits||{},overview=d.overview||'Sinopse não disponível.';var creators=(d.created_by||[]).map(function(p){return '<span class="tmdb-credit-chip">'+escapeHtml(p.name||'')+'</span>';}).join('')||'<span style="color:var(--text-dim);font-size:12px;">Não disponível.</span>';var directors=tmdbCrewChips(credits.crew,'Directing',function(job,jobs){return /director/i.test(job)||jobs.some(function(x){return /director/i.test(x);});});var writers=tmdbCrewChips(credits.crew,'Writing',function(job,jobs){return /writer|screenplay|teleplay/i.test(job)||jobs.some(function(x){return /writer|screenplay|teleplay/i.test(x);});});var producers=tmdbCrewChips(credits.crew,'Production',function(job,jobs){return /producer/i.test(job)||jobs.some(function(x){return /producer/i.test(x);});});return '<div class="tmdb-series-header"><div class="tmdb-series-poster" style="'+posterBackgroundStyle(cat,'w500')+'"></div><div class="tmdb-series-copy"><div class="modal-title">'+escapeHtml(d.name||cat.title)+'</div><div style="font-size:12px;color:var(--text-muted);margin-top:4px;">'+escapeHtml([d.first_air_date?d.first_air_date.slice(0,4):'',d.number_of_seasons?d.number_of_seasons+' temporadas':'',d.number_of_episodes?d.number_of_episodes+' episódios':''].filter(Boolean).join(' · '))+'</div><p class="tmdb-overview">'+escapeHtml(overview)+'</p></div></div><div class="tmdb-credit-grid"><div class="tmdb-credit-block"><h4>Criador(es)</h4><div class="tmdb-credit-list">'+creators+'</div></div><div class="tmdb-credit-block"><h4>Direção</h4><div class="tmdb-credit-list">'+directors+'</div></div><div class="tmdb-credit-block"><h4>Roteiro</h4><div class="tmdb-credit-list">'+writers+'</div></div><div class="tmdb-credit-block"><h4>Produção</h4><div class="tmdb-credit-list">'+producers+'</div></div><div class="tm   function pruneTransientTmdbCatalog(){

  function hydrateCatalogs(cats){

  /* ---------------- stars widget ---------------- */
  function renderStars(value, size, scope, catalogId, season, episode){
    value = value || 0;
    var pct = Math.max(0, Math.min(100, (value/5)*100));
    var hits = '';
    for(var i=1;i<=5;i++){
      hits += starHit(i-0.5, scope, catalogId, season, episode);
      hits += starHit(i, scope, catalogId, season, episode);
    }
    return '<div class="stars' + (size?(' '+size):'') + '">' +
      '<div class="stars-bg">★★★★★</div>' +
      '<div class="stars-fg" style="width:' + pct + '%">★★★★★</div>' +
      '<div class="stars-hit">' + hits + '</div>' +
      '</div>';
  }
  function starHit(val, scope, catalogId, season, episode){
    var attrs = 'data-action="rate" data-scope="' + scope + '" data-catalog="' + catalogId + '" data-val="' + val + '"';
    if(season!==undefined && season!==null) attrs += ' data-season="' + season + '"';
    if(episode!==undefined && episode!==null) attrs += ' data-episode="' + episode + '"';
    return '<button class="hit" ' + attrs + '></button>';
  }

  /* ---------------- view: diario (calendário vertical) ----------------
     O Diário passa a exibir os registros como um calendário vertical
     (mês → dias → registros do dia), preservando os dois tipos de
     registro: de série inteira ("type:'series'", formato antigo, inclusive
     registros salvos antes desta atualização, que não tinham "type" e
     continuam sendo tratados como série) e de episódio individual
     ("type:'episode'", novo). */
  function viewDiario(){
    var entries = state.diary.slice().sort(function(a,b){ return new Date(b.date)-new Date(a.date) || (''+b.id).localeCompare(''+a.id); });
    if(entries.length===0){
      return '<div class="empty"><strong>Nenhum registro ainda.</strong>Abra um título na sua estante e clique em "Registrar hoje", ou registre um episódio específico, para começar seu diário.</div>';
    }
    var monthOrder = [], byMonth = {};
    entries.forEach(function(e){
      var d = new Date(e.date + 'T12:00:00');
      var mKey = d.getFullYear() + '-' + d.getMonth();
      if(!byMonth[mKey]){ byMonth[mKey] = { date:d, days:{}, dayOrder:[] }; monthOrder.push(mKey); }
      var m = byMonth[mKey];
      if(!m.days[e.date]){ m.days[e.date] = []; m.dayOrder.push(e.date); }
      m.days[e.date].push(e);
    });

    var html = '';
    monthOrder.forEach(function(mKey){
      var m = byMonth[mKey];
      var monthLabel = m.date.toLocaleDateString('pt-BR', { month:'long', year:'numeric' });
      html += '<div class="cal-month"><div class="cal-month-label">' + escapeHtml(monthLabel) + '</div>';
      m.dayOrder.forEach(function(dayKey){
        var dDate = new Date(dayKey + 'T12:00:00');
        var dayNum = dDate.getDate();
        var wd = dDate.toLocaleDateString('pt-BR', { weekday:'short' }).replace('.', '');
        html += '<div class="cal-day"><div class="cal-day-num"><div class="num">' + dayNum + '</div><div class="wd">' + escapeHtml(wd) + '</div></div><div class="cal-day-rule"></div><div class="cal-day-entries">';
        m.days[dayKey].forEach(function(e){
          var cat = getCatalog(e.catalogId);
          if(!cat) return;
          var letter = cat.title.trim().charAt(0).toUpperCase();
          var isEpisode = e.type==='episode';
          html += (
            '<div class="cal-entry">' +
              '<div class="cal-dot" style="' + swatchStyle(cat.title) + '">' + escapeHtml(letter) + '</div>' +
              '<div class="cal-entry-body">' +
                '<div class="cal-entry-top">' +
                  '<span class="cal-title" data-action="open-show" data-catalog="' + cat.id + '">' + escapeHtml(cat.title) + '</span>' +
                  '<div class="inline-actions">' +
                    '<span class="cal-kind-badge' + (isEpisode?' episode':'') + '">' + (isEpisode?'Episódio':'Série') + '</span>' +
                    (e.rating ? '<span class="card-stars">★ ' + Number(e.rating).toFixed(1) + '</span>' : '') +
                    '<button class="diary-del" data-action="delete-diary" data-entry="' + e.id + '">Remover</button>' +
                  '</div>' +
                '</div>' +
                (isEpisode ? '<div class="cal-ep-tag">Temporada ' + e.season + ' • Episódio ' + e.episode + '</div>' : '') +
                (e.note ? '<div class="cal-note">' + escapeHtml(e.note) + '</div>' : '') +
              '</div>' +
            '</div>'
          );
        });
        html += '</div></div>';
      });
      html += '</div>';
    });
    return html;
  }

  function listCoverHtml(list){
    if(list.coverUrl){
      return '<div class="list-cover"><div class="custom-list-cover" style="background-image:url(\''+String(list.coverUrl).replace(/'/g,'%27')+'\')"></div></div>';
    }

    if(cats.length===0)return '<div class="list-cover list-cover-empty">Adicione séries</div>';
    if(cats.length===1)return '<div class="list-cover list-cover-1"><div class="list-cover-tile" style="'+posterBackgroundStyle(cats[0],'w500')+'"></div></div>';

  /* ---------------- premium evaluation formats ---------------- */
  /* Amadurecimento da amora: cada estágio representa uma faixa de avaliação
     própria do Bingeo (não é apenas uma escala de estrelas trocada por emoji).
     A barra "berry-vine" cresce conforme o estágio escolhido, o estágio ativo
     ganha destaque visual (escala, brilho, selo) e um rótulo explica o que
     aquele estágio significa. */
  var BERRY_STAGES=[
    {value:1, emoji:'🌱', name:'Broto',         desc:'Muito ruim'},
    {value:2, emoji:'🍃', name:'Brotando',      desc:'Ruim'},
    {value:3, emoji:'🟣', name:'Amadurecendo',  desc:'Mediana'},
    {value:4, emoji:'🫐', name:'Quase no ponto',desc:'Boa'},
    {value:5, emoji:'🍇', name:'No ponto',      desc:'Excelente'}
  ];
  var REACTIONS=['🔥','❤️','😂','😮','😭','🤯','👏','💀'];
  function berryLabHtml(pr, catalogId){
    var stage = BERRY_STAGES.filter(function(b){ return b.value===pr.value; })[0];
    var pct = pr.value ? (pr.value/5)*100 : 0;
    var html = '<div class="berry-lab">';
    html += '<div class="berry-vine"><div class="berry-vine-fill" style="width:' + pct + '%"></div></div>';
    html += '<div class="berry-scale">' + BERRY_STAGES.map(function(b){
      var isActive = pr.value===b.value;
      return (
        '<button class="berry-stage2' + (isActive?' active':'') + '" data-action="premium-value" data-catalog="' + catalogId + '" data-value="' + b.value + '" title="' + b.desc + '">' +
          '<span class="berry-emoji2">' + b.emoji + '</span>' +
          '<span class="berry-name2">' + b.name + '</span>' +
          '<span class="berry-desc2">' + b.desc + '</span>' +
        '</button>'
      );
    }).join('') + '</div>';
    html += '<div class="berry-current-label">' + (stage ? ('Sua amora está <strong>' + stage.name + '</strong> — ' + stage.desc.toLowerCase() + '.') : 'Toque em um estágio para amadurecer sua amora e registrar sua nota.') + '</div>';
    html += '</div>';
    return html;
  }
  var BINGEO_CRITERIA=[
    {key:'story',label:'História'},
    {key:'characters',label:'Personagens'},
    {key:'acting',label:'Atuação'},
    {key:'visual',label:'Visual'},
    {key:'ending',label:'Final'}

  function userEpisodeProgress(catalogId){
    var max={season:0,episode:0};
    state.diary.forEach(function(d){
      if(d.catalogId!==catalogId||d.type!=='episode')return;
      var s=Number(d.season)||0,e=Number(d.episode)||0;
      if(s>max.season||(s===max.season&&e>max.episode))max={season:s,episode:e};
    });
    return max;
  }
  function spoilerKey(catalogId,review,index){return catalogId+'|'+index+'|'+(review.username||'')+'|'+(review.updated_at||'');}
  function canViewCommunityReview(catalogId,review,index){
    if(!review||review.spoiler_level==='none'||!review.spoiler_level)return true;
    if(state.revealedSpoilers[spoilerKey(catalogId,review,index)])return true;
    var entry=getEntry(catalogId);
    if(entry&&entry.status==='completo')return true;
    if(review.spoiler_level==='full')return false;
    var p=userEpisodeProgress(catalogId),rs=Number(review.spoiler_season)||0,re=Number(review.spoiler_episode)||0;
    return p.season>rs||(p.season===rs&&p.episode>=re);
  }
  function spoilerLabel(review){
    if(!review||review.spoiler_level==='none'||!review.spoiler_level)return 'Sem spoilers';
    if(review.spoiler_level==='full')return 'Spoilers da série completa';
    return 'Spoilers até T'+(review.spoiler_season||'?')+'E'+(review.spoiler_episode||'?');
  }

  async function loadSeriesCommunity(catalogId,rerender){
    if(!catalogId||state.communityLoading[catalogId])return;
    state.communityLoading[catalogId]=true;
    try{
      var result=await supabaseClient.rpc('get_series_community',{p_catalog_id:catalogId});

      state.seriesCommunity[catalogId]=result.data||{};

  function renderModalPreserveScroll(){
    var oldOverlay=document.querySelector('#modalRoot .modal-overlay');

    renderModal();
    var newOverlay=document.querySelector('#modalRoot .modal-overlay');
    if(newOverlay){
      newOverlay.scrollTop=scrollTop;
      requestAnimationFrame(function(){newOverlay.scrollTop=scrollTop;});
    }
  }
  function renderMainViewOnly(){
    var root=document.getElementById('viewRoot');
    if(!root)return;
    if(state.view==='descobrir')root.innerHTML=viewDescobrir();
    else if(state.view==='estante')root.innerHTML=viewEstante();
    else if(state.view==='diario')root.innerHTML=viewDiario();
    else if(state.view==='listas')root.innerHTML=viewListas();
    else if(state.view==='perfil')root.innerHTML=viewPerfil();

  /* ---------------- master render ---------------- */
  function render(){
    document.querySelectorAll('#navLinks .nav-link').forEach(function(btn){
      btn.classList.toggle('active', btn.dataset.view===state.view);
    });
    renderTicker();
    var root = document.getElementById('viewRoot');
    if(state.view==='descobrir') root.innerHTML = viewDescobrir();
    else if(state.view==='estante') root.innerHTML = viewEstante();
    else if(state.view==='diario') root.innerHTML = viewDiario();
    else if(state.view==='listas') root.innerHTML = viewListas();
    else if(state.view==='perfil') root.innerHTML = viewPerfil();

  function renderTicker(){
    var watching = state.entries.filter(function(e){ return e.status==='assistindo'; });
    var bar = document.getElementById('tickerBar');
    if(watching.length===0){
      bar.innerHTML = '<span class="no-live">Nada no ar agora — adicione algo que você está assistindo</span>';
      return;
    }
    var items = watching.map(function(e){
      var cat = getCatalog(e.catalogId);
      if(!cat) return '';
      return '<span class="ticker-item"><span class="live-dot"></span>' + escapeHtml(cat.title) + '</span>';
    }).join('');
    bar.innerHTML = '<div class="ticker-track' + (watching.length<3?' slow':'') + '">' + items + items + '</div>';
  }

  function bindFormsForCurrentView(){
    var nl = document.getElementById('newListForm');
    if(nl){
      nl.addEventListener('submit', function(e){
        e.preventDefault();
        var fd = new FormData(nl);
        var name = (fd.get('name')||'').trim();
        if(!name) return;
        if(!hasPro() && state.lists.length>=5){ alert('O plano gratuito permite até 5 listas. Faça upgrade para o Bingeo Pro para criar mais.'); return; }
        var nowIso = new Date().toISOString();
        var newList={
          id:uid(),name:name,description:(fd.get('description')||'').trim(),showIds:[],
          owner:state.profile.username||null,ownerUserId:currentUserId,isOwner:true,visibility:'private',
          coverUrl:null,shareSlug:makeShareSlug(name),allowComments:true,collaborators:[],comments:[],
          createdAt:nowIso,updatedAt:nowIso
        };
        state.lists.unshift(newList);
        saveData();syncListToSupabase(newList);render();
      });
    }
    var collabForm=document.getElementById('listCollaboratorForm');
    if(collabForm){
      collabForm.addEventListener('submit',function(e){
        e.preventDefault();
        var list=state.lists.find(function(l){return l.id===state.listOpen;});
        var fd=new FormData(collabForm),username=String(fd.get('username')||'').trim().replace(/^@/,'');
        if(!list||!username)return;
        syncListToSupabase(list).then(function(){
          return supabaseClient.rpc('add_list_collaborator_by_username',{p_list_client_id:list.id,p_username:username});
        }).then(function(result){
          if(result.error)throw result.error;
          alert((result.data&&result.data.message)||'Colaborador atualizado.');
          return loadListExtras(list);
        }).then(renderMainViewOnly).catch(function(err){alert(err.message||'Não foi possível adicionar o colaborador.');});
      });
    }
    var listCommentForm=document.getElementById('listCommentForm');
    if(listCommentForm){
      listCommentForm.addEventListener('submit',function(e){
        e.preventDefault();
        var list=state.lists.find(function(l){return l.id===state.listOpen;});
        var fd=new FormData(listCommentForm),body=String(fd.get('comment')||'').trim();
        if(!list||!body)return;
        supabaseClient.rpc('add_list_comment',{p_list_client_id:list.id,p_body:body}).then(function(result){
          if(result.error)throw result.error;
          if(result.data&&!result.data.ok)throw new Error(result.data.message||'Não foi possível comentar.');
          return loadListExtras(list);
        }).then(renderMainViewOnly).catch(function(err){alert(err.message||'Não foi possível publicar o comentário.');});
      });
    }
    var statusSel = document.getElementById('statusSelect');
    if(statusSel){
      statusSel.addEventListener('change', function(){
        var entry = getEntry(state.modalCatalogId);
        if(!entry) return;
        entry.status = statusSel.value;
        entry.dateUpdated = new Date().toISOString();
        if(statusSel.value==='assistindo' || statusSel.value==='completo') bumpTrending(entry.catalogId);
        saveData();
        syncEntryToSupabase(entry);
        renderMainViewOnly();
        renderModalPreserveScroll();
      });
    }
    var spoilerLevelSel=document.getElementById('spoilerLevel');
    if(spoilerLevelSel){
      spoilerLevelSel.addEventListener('change',function(){
        var enabled=spoilerLevelSel.value==='episode';

  function readAndResizeImage(file){
    return new Promise(function(resolve, reject){
      if(file && file.type==='image/gif' && hasPro()){
        var gifReader = new FileReader();
        gifReader.onload=function(ev){resolve(ev.target.result);};
        gifReader.onerror=reject;
        gifReader.readAsDataURL(file);
        return;
      }
      var reader = new FileReader();
      reader.onload = function(ev){
        var img = new Image();
        img.onload = function(){
          var size = 300;
          var canvas = document.createElement('canvas');
          canvas.width = size; canvas.height = size;
          var ctx = canvas.getContext('2d');
          var scale = Math.max(size/img.width, size/img.height);
          var w = img.width*scale, h = img.height*scale;
          ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = reject;
        img.src = ev.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  function readImage(file){return new Promise(function(resolve,reject){var r=new FileReader();r.onload=function(e){resolve(e.target.result);};r.onerror=reject;r.readAsDataURL(file);});}

  });

  function resizeListCoverBlob(file){
    return new Promise(function(resolve,reject){
      var reader=new FileReader();
      reader.onload=function(ev){
        var img=new Image();
        img.onload=function(){
          var w=1200,h=675,canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
          var ctx=canvas.getContext('2d'),scale=Math.max(w/img.width,h/img.height),dw=img.width*scale,dh=img.height*scale;
          ctx.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh);
          canvas.toBlob(function(blob){blob?resolve(blob):reject(new Error('Não foi possível processar a capa.'));},'image/jpeg',0.86);
        };
        img.onerror=reject;img.src=ev.target.result;
      };
      reader.onerror=reject;reader.readAsDataURL(file);
    });
  }
