<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingeo — sua estante de séries</title>
<link rel="icon" type="image/jpeg" href="/assets/bingeo-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="/js/theme-bootstrap.js?v=20260928-theme-fix-1"></script>
<link rel="stylesheet" href="/css/00-base.css?v=20260928-theme-fix-1">
<link rel="stylesheet" href="/css/05-theme.css?v=20260928-theme-fix-1">
<link rel="stylesheet" href="/css/10-layout.css?v=20260928-theme-fix-1">
<link rel="stylesheet" href="/css/20-content.css?v=20260928-theme-fix-1">
<link rel="stylesheet" href="/css/30-profile.css?v=20260928-theme-fix-1">
<link rel="stylesheet" href="/css/40-evaluations.css?v=20260928-theme-fix-1">
<link rel="stylesheet" href="/css/50-community.css?v=20260928-lists-share-v1">
<link rel="stylesheet" href="/css/60-social.css?v=20260928-remove-profile-highlights-v1">
</head>
<body>

<div id="authGate" class="auth-gate">
  <div class="auth-card">
    <div class="auth-logo"><img class="bingeo-logo-img" src="/assets/bingeo-logo.jpg" alt="Logo do Bingeo"></div>
    <h1 class="auth-title">Bingeo<span class="dot">.</span></h1>
    <div class="auth-sub" id="authSubtitle">Entre para continuar acompanhando suas séries, avaliações, diário e listas.</div>
    <div class="auth-tabs">
      <button type="button" class="active" id="authLoginTab">Entrar</button>
      <button type="button" id="authSignupTab">Criar conta</button>
    </div>
    <form id="authForm">
      <label class="auth-field" id="authUsernameField" style="display:none"><span>Nome de usuário</span><input id="authUsername" autocomplete="username" maxlength="30" placeholder="seu_usuario"></label>
      <label class="auth-field"><span>E-mail</span><input id="authEmail" type="email" autocomplete="email" required placeholder="voce@email.com"></label>
      <label class="auth-field"><span>Senha</span><input id="authPassword" type="password" autocomplete="current-password" minlength="6" required placeholder="Mínimo de 6 caracteres"></label>
      <label class="auth-field" id="authConfirmField" style="display:none"><span>Confirmar senha</span><input id="authConfirmPassword" type="password" autocomplete="new-password" minlength="6" placeholder="Repita sua senha"></label>
      <div class="auth-error" id="authError"></div>
      <button class="btn btn-primary auth-submit" type="submit" id="authSubmit">Entrar</button>
    </form>
    <div class="auth-foot">Sua conta mantém seus dados separados e protegidos no Bingeo.</div>
  </div>
</div>
<div id="appShell" style="display:none">
<div class="ticker-bar" id="tickerBar"></div>
<header class="topbar">
  <div class="brand-with-logo"><div class="brand-logo"><img class="bingeo-logo-img" src="/assets/bingeo-logo.jpg" alt="Logo do Bingeo"></div><div class="brand">Bingeo<span class="dot">.</span></div></div>
  <nav class="nav" id="navLinks">
    <button class="nav-link" data-view="descobrir">Descobrir</button>
    <button class="nav-link" data-view="estante">Estante</button>
    <button class="nav-link" data-view="diario">Diário</button>
    <button class="nav-link" data-view="listas">Listas</button>
    <button class="nav-link" data-view="perfil">Perfil</button>
  </nav>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Buscar séries, personagens, profissionais ou usuários…">
  </div>
  <button class="account-btn" id="logoutBtn">Sair</button>
</header>

<main id="viewRoot"></main>
<div id="modalRoot"></div>
<input type="file" id="avatarInput" accept="image/*" hidden>
<input type="file" id="bannerInput" accept="image/*" hidden>
<input type="file" id="listCoverInput" accept="image/*" hidden>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/app.bundle.js?v=20260928-lists-share-v1"></script>
</body>
</html>
